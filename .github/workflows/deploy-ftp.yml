name: Deploy to reg.ru (FTP)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-ftp
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      # Секреты сервера собираются в config.php прямо при деплое (в репозитории их нет).
      - name: Create server config
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
        run: |
          test -n "$ADMIN_PASSWORD" && test -n "$TG_TOKEN" && test -n "$TG_CHAT" || { echo "Нужны секреты ADMIN_PASSWORD, TG_TOKEN, TG_CHAT"; exit 1; }
          php -r '
            $t = getenv("TG_TOKEN");
            $cfg = [
              "admin_user" => "topikan",
              "admin_hash" => password_hash(getenv("ADMIN_PASSWORD"), PASSWORD_DEFAULT),
              "tg_token" => $t,
              "tg_chat" => getenv("TG_CHAT"),
              "admin_url" => "https://rodionfrontend.ru/admin/",
              "salt" => hash("sha256", "salt|" . $t),
              "db_file" => "requests-" . substr(hash("sha256", "db|" . $t), 0, 12) . ".sqlite",
            ];
            file_put_contents("dist/api/config.php", "<?php\nreturn " . var_export($cfg, true) . ";\n");
          '

      - name: Upload via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: 37.140.192.54
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          local-dir: ./dist/
          server-dir: ${{ vars.FTP_DIR || 'www/rodionfrontend.ru/' }}
          exclude: |
            **/.git*
            **/.git*/**
            api/data/**
